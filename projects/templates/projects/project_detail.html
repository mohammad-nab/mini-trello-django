{% extends 'templates/base.html' %}

{% block content %}
<div class="container mt-4">

    <div class="card">
        <div class="card-body">

            <h2>{{ project.name }}</h2>

            <p class="text-muted">
                Created: {{ project.created_at }}
            </p>

            <p>
                <strong>Owner:</strong>
                {{ project.owner.username }}
            </p>

            <hr>

            <h5>Description</h5>
            <p>
                {{ project.description }}
            </p>

            <hr>

            <a href="{% url 'projects:update-project' project.id %}" class="btn btn-warning">
                Edit Project
            </a>
            {% if request.user == project.owner %}
                <form method="post"
                      action="{% url 'projects:delete-project' project.id %}"
                      class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        Delete Project
                    </button>
                </form>
            {% endif %}

        </div>
    </div>

</div>
{% endblock %}
